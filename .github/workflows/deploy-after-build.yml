name: Deploy After Build

on:
  workflow_run:
    workflows:
      - Build Images
    types:
      - completed
  # Redeploy whatever IMAGE in the host's env file points at (usually :latest),
  # without building.
  workflow_dispatch:

concurrency:
  group: deploy-after-build
  cancel-in-progress: false

jobs:
  deploy:
    # Only a successful build of a build-X.Y.Z tag deploys; a manual build stops
    # at the registry. A manual run of this workflow deploys directly.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          startsWith(github.event.workflow_run.head_branch, 'build-')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "${DEPLOY_SSH_KEY}" && -n "${DEPLOY_KNOWN_HOSTS}" ]] || {
            echo "Missing secret DEPLOY_SSH_KEY or DEPLOY_KNOWN_HOSTS"; exit 1; }
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_KEY}" >"${HOME}/.ssh/deploy_key"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >"${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/deploy_key" "${HOME}/.ssh/known_hosts"

      - name: Deploy on server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
          # Optional; undefined repo variables expand to "" and fall back below.
          SIDECAR_SERVICE: ${{ vars.SIDECAR_SERVICE }}
        run: |
          set -euo pipefail
          [[ -n "${DEPLOY_HOST}" ]] || { echo "Missing variable DEPLOY_HOST"; exit 1; }
          deploy_user="${DEPLOY_USER:-root}"
          deploy_port="${DEPLOY_PORT:-22}"
          env_file="${DEPLOY_ENV_FILE:-/opt/animal-ml/config/.env}"
          sidecar_service="${SIDECAR_SERVICE:-animal-ml.service}"

          ssh -i "${HOME}/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -p "${deploy_port}" \
            "${deploy_user}@${DEPLOY_HOST}" \
            "ENV_FILE='${env_file}' SIDECAR_SERVICE='${sidecar_service}' bash -s" <<'REMOTE'
          set -euo pipefail

          set -a
          source "${ENV_FILE}"
          set +a

          if [[ -z "${IMAGE:-}" ]]; then
            echo "Set IMAGE in ${ENV_FILE}"
            exit 1
          fi

          echo "Pulling ${IMAGE}"
          podman pull "${IMAGE}"
          sudo systemctl restart "${SIDECAR_SERVICE}"
          sudo systemctl status "${SIDECAR_SERVICE}" --no-pager
          REMOTE
